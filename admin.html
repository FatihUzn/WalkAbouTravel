<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalkAbout Travel - Admin Panel (Full CRUD)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1800px; margin: 0 auto; }
        
        /* LOGIN */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        .login-header { text-align: center; margin-bottom: 40px; }
        .login-header i { font-size: 60px; color: #667eea; margin-bottom: 20px; }
        .login-header h1 { font-size: 2em; color: #334155; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 100%;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .info-box {
            background: #f0f9ff;
            border: 2px solid #38bdf8;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .info-box h4 { color: #0284c7; margin-bottom: 10px; }
        .info-box code { background: white; padding: 2px 8px; border-radius: 4px; font-family: monospace; color: #0284c7; }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.show { display: flex; align-items: center; gap: 10px; }
        .alert-error { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; }
        .alert-success { background: #d1fae5; border: 2px solid #10b981; color: #065f46; }
        .alert-info { background: #dbeafe; border: 2px solid #3b82f6; color: #1e40af; }
        
        /* ADMIN PANEL */
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        
        .admin-header {
            background: white;
            padding: 20px 30px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0;
        }
        .admin-header-left { display: flex; align-items: center; gap: 15px; }
        .admin-header-left i { font-size: 2em; color: #667eea; }
        .admin-header-left h1 { font-size: 1.8em; color: #334155; }
        .admin-header-right { display: flex; align-items: center; gap: 20px; }
        
        .github-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #d1fae5;
            border-radius: 10px;
            border: 2px solid #10b981;
        }
        
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .logout-btn {
            padding: 10px 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tabs {
            background: white;
            display: flex;
            gap: 0;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab-button {
            flex: 1;
            padding: 20px;
            background: transparent;
            border: none;
            font-size: 1.1em;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .tab-button:hover { background: #f8fafc; color: #38bdf8; }
        .tab-button.active { color: #38bdf8; background: #f0f9ff; border-bottom: 3px solid #38bdf8; }
        
        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .tab-content.active { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .form-section, .preview-section {
            background: #f8fafc;
            padding: 25px;
            border-radius: 15px;
            max-height: 75vh;
            overflow-y: auto;
        }
        
        .section-title {
            font-size: 1.5em;
            color: #334155;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #38bdf8;
            position: sticky;
            top: 0;
            background: #f8fafc;
            z-index: 10;
        }
        
        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }
        
        .translate-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        
        .form-group textarea { min-height: 80px; resize: vertical; }
        
        .image-upload-area {
            border: 3px dashed #cbd5e1;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        .image-upload-area:hover { border-color: #38bdf8; background: #f0f9ff; }
        .image-upload-area i { font-size: 3em; color: #94a3b8; margin-bottom: 10px; }
        
        .image-preview {
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        .image-preview.show { display: block; }
        .image-preview img {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: cover;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-small { padding: 8px 15px; font-size: 0.9em; }
        
        .translation-progress {
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            border: 2px solid #38bdf8;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            display: none;
        }
        .translation-progress.show { display: block; }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0f2fe;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #3b82f6);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card .number { font-size: 2.5em; font-weight: bold; }
        
        .items-list { max-height: 500px; overflow-y: auto; }
        .item-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            transition: all 0.3s;
        }
        .item-card:hover { transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .item-card img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }
        .item-info { flex: 1; }
        .item-info h4 { color: #334155; margin-bottom: 5px; }
        .item-info p { color: #64748b; font-size: 0.9em; }
        .item-actions {
            display: flex;
            gap: 8px;
        }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        .modal-header h3 { color: #334155; font-size: 1.5em; }
        .modal-close {
            background: #ef4444;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
        }
        
        @media (max-width: 1200px) {
            .tab-content.active { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SCREEN -->
        <div class="login-screen" id="loginScreen">
            <div class="login-box">
                <div class="login-header">
                    <i class="fas fa-plane-departure"></i>
                    <h1>WalkAbout Travel</h1>
                    <p>Admin Panel - Full CRUD + Auto GitHub</p>
                </div>
                
                <div class="alert" id="loginAlert"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label>GitHub Token</label>
                        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" required>
                    </div>
                    
                    <div class="form-group">
                        <label>GitHub Username</label>
                        <input type="text" id="githubUsername" placeholder="your-username" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Repository Name</label>
                        <input type="text" id="repoName" placeholder="walkabout-travel" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Login & Connect GitHub
                    </button>
                </form>
                
                <div class="info-box">
                    <h4><i class="fas fa-info-circle"></i> Demo</h4>
                    <p><strong>Username:</strong> <code>admin</code><br>
                    <strong>Password:</strong> <code>walkabout2024</code></p>
                </div>
            </div>
        </div>
        
        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-header">
                <div class="admin-header-left">
                    <i class="fas fa-globe"></i>
                    <h1>Content Manager</h1>
                </div>
                <div class="admin-header-right">
                    <div class="github-status">
                        <i class="fab fa-github"></i>
                        <span>GitHub Connected</span>
                    </div>
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">A</div>
                        <span id="userDisplayName">Admin</span>
                    </div>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
            
            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('blog')">
                    <i class="fas fa-blog"></i> Blog Posts
                </button>
                <button class="tab-button" onclick="switchTab('tours')">
                    <i class="fas fa-map-marked-alt"></i> Tours
                </button>
            </div>
            
            <!-- BLOG TAB -->
            <div id="tab-blog" class="tab-content active">
                <div class="form-section">
                    <h2 class="section-title"><i class="fas fa-edit"></i> <span id="blog-form-title">New Blog</span></h2>
                    <div class="alert" id="blog-alert"></div>
                    <div class="translation-progress" id="blog-progress">
                        <div><i class="fas fa-spinner fa-spin"></i> <span id="blog-progress-text">Processing...</span></div>
                        <div class="progress-bar"><div class="progress-fill" id="blog-progress-fill"></div></div>
                    </div>
                    
                    <form id="blogForm">
                        <input type="hidden" id="blog-edit-id">
                        <input type="hidden" id="blog-edit-index">
                        
                        <div class="form-group">
                            <label><i class="fas fa-image"></i> Image *</label>
                            <div class="image-upload-area" id="blog-upload-area">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Click or drag & drop</p>
                            </div>
                            <input type="file" id="blog-image" accept="image/*" style="display:none;">
                            <div class="image-preview" id="blog-preview">
                                <img id="blog-preview-img" src="" alt="Preview">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>🇹🇷 Title (Turkish) *<span class="translate-badge"><i class="fas fa-magic"></i> Auto</span></label>
                            <input type="text" id="blog-title-tr" required>
                        </div>
                        
                        <div class="form-group">
                            <label>🇹🇷 Description *</label>
                            <textarea id="blog-desc-tr" rows="3" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>🇹🇷 Content *</label>

                        </div>
                        
                        <div class="form-group">

                            <select id="blog-category" required>
                                <option value="">Select...</option>
                                <option value="GEZİ REHBERİ">Travel Guide</option>
                                <option value="İPUÇLARI">Tips</option>
                                <option value="KÜLTÜR">Culture</option>
                                <option value="MACERA">Adventure</option>
                            </select>
                        </div>
                        
                        <div class="button-group">
                            <button type="submit" class="btn btn-success">

                </div>
                
                <div class="preview-section">
                    <h2 class="section-title"><i class="fas fa-list"></i> Blog Posts</h2>
                    <div class="stats">
                        <div class="stat-card">
                            <div class="number" id="blog-count">0</div>
                            <div class="label">Total Blogs</div>

                    <div class="items-list" id="blog-list"></div>

            <!-- TOURS TAB -->
            <div id="tab-tours" class="tab-content">

                        <div class="form-group">

                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-clock"></i> Duration *</label>

                        <div class="form-group">
                            <label><i class="fas fa-map-marker-alt"></i> Location *</label>
                            <input type="text" id="tour-location" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-map"></i> Area *</label>
                            <input type="text" id="tour-area" required>
                        </div>
                        
                        <div class="form-group">
                            <label><i class="fas fa-tag"></i> Category *</label>
                            <select id="tour-category" required>
                                <option value="">Select...</option>
                                <option value="Kültür">Culture</option>
                                <option value="Macera">Adventure</option>
                                <option value="Deniz">Sea</option>
                                <option value="Doğa">Nature</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>🇹🇷 Description *</label>
                            <textarea id="tour-desc-tr" rows="3" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>🇹🇷 Content *</label>
                            <textarea id="tour-content-tr" rows="6" required></textarea>
                        </div>
                        
                        <div class="button-group">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-cloud-upload-alt"></i> <span id="tour-submit-text">Save to GitHub</span>
                            </button>
                            <button type="button" class="btn btn-warning" onclick="resetTourForm()">
                                <i class="fas fa-redo"></i> Reset
                            </button>
                        </div>
                    </form>
                </div>
                
                <div class="preview-section">
                    <h2 class="section-title"><i class="fas fa-list"></i> Tour Packages</h2>
                    <div class="stats">
                        <div class="stat-card">
                            <div class="number" id="tour-count">0</div>
                            <div class="label">Total Tours</div>
                        </div>
                    </div>
                    <div class="items-list" id="tour-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Config
        const ADMIN = { username: 'admin', password: 'walkabout2024' };
        const SESSION_KEY = 'walkabout_admin_session';
        
        let githubConfig = { token: '', username: '', repo: '' };
        let blogPosts = [];
        let tours = [];
        let currentBlogImage = null, currentBlogImageName = null;
        let currentTourImage = null, currentTourImageName = null;
        let blogTranslations = {}, tourTranslations = {};
        let editingBlogIndex = null, editingTourIndex = null;
        
        // ============================================
        // AKILLI ID SİSTEMİ
        // ============================================
        const categoryPrefixes = {
            'Türkiye': 'TR',
            'Avrupa': 'EU', 
            'Amerika': 'AM',
            'Asya': 'AS',
            'Afrika': 'AF',
            'Okyanusya': 'OC'
        };

        function generateSlug(text) {
            const turkishMap = {
                'ç':'c', 'ğ':'g', 'ı':'i', 'ö':'o', 'ş':'s', 'ü':'u',
                'Ç':'C', 'Ğ':'G', 'İ':'I', 'Ö':'O', 'Ş':'S', 'Ü':'U'
            };
            
            return text
                .split('')
                .map(char => turkishMap[char] || char)
                .join('')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .substring(0, 20);
        }

        function generateTourId(category, title) {
            const prefix = categoryPrefixes[category] || 'GEN';
            const slug = generateSlug(title);
            return `TUR-${prefix}-${slug}`;
        }

        // ============================================
        // FORMAT DÖNÜŞÜMÜ
        // ============================================
        function convertToNewFormat(tour) {
            return {
                id: tour.id,
                title: {
                    tr: tour.title || tour.title_tr || '',
                    en: tour.title_en || '',
                    es: tour.title_es || '',
                    ru: tour.title_ru || '',
                    de: tour.title_de || '',
                    ar: tour.title_ar || '',
                    zh: tour.title_zh || ''
                },
                description: {
                    tr: tour.description || tour.description_tr || '',
                    en: tour.description_en || '',
                    es: tour.description_es || '',
                    ru: tour.description_ru || '',
                    de: tour.description_de || '',
                    ar: tour.description_ar || '',
                    zh: tour.description_zh || ''
                },
                price: tour.price || '',
                duration: tour.duration || '',
                location: tour.location || '',
                area: tour.area || '',
                category: tour.category || '',
                image: tour.image || '',
                images: tour.images || [tour.image],
                highlights: tour.highlights || [],

        // ==========================================
        // DÜZELTİLMİŞ VE URL GÖSTEREN LOAD DATA
        // ==========================================
        
        async function loadData() {
            // Hata ve Bilgi Mesajlarını Gösteren Fonksiyon
            function debugLog(msg, type = 'info') {
                console.log(msg);
                const alertBox = document.getElementById('loginAlert');
                if(alertBox) {
                    alertBox.style.display = 'block';
                    alertBox.className = `alert alert-${type} show`;
                    alertBox.innerHTML += `<div style="margin-bottom:5px; border-bottom:1px solid rgba(0,0,0,0.1); padding-bottom:5px;">${msg}</div>`;
                }
            }

            // Türkçe karakter çözücü
            function safeDecode(base64) {
                try {
                    return decodeURIComponent(escape(window.atob(base64)));
                } catch (e) {
                    return window.atob(base64);
                }
            }

            try {
                // Ekranı temizle
                const alertBox = document.getElementById('loginAlert');
                if(alertBox) alertBox.innerHTML = ''; 
                
                const headers = {
                    'Authorization': `token ${githubConfig.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                };

                // --- 1. BLOGLARI ÇEK ---
                // Hangi adrese gittiğimizi görelim:
                const blogUrl = `https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/data/blog-posts.json`;
                debugLog(`🔍 Blog aranıyor: ${blogUrl}`, 'info');

                const blogsResponse = await fetch(blogUrl, { headers });

                if (!blogsResponse.ok) {
                    // HATA VARSA URL'Yİ GÖSTER
                    throw new Error(`Blog bulunamadı (404). <br><strong>Şu adrese ulaşmaya çalıştım:</strong><br> ${blogUrl} <br>Lütfen Repo adının (WalkAboutTravel) ve Kullanıcı adının (FatihUzn) birebir doğru olduğundan emin ol.`);
                }

                const blogsData = await blogsResponse.json();
                try {
                    const blogsContent = safeDecode(blogsData.content);
                    blogPosts = JSON.parse(blogsContent);
                    debugLog(`✅ Bloglar yüklendi: ${blogPosts.length} adet`, 'success');
                } catch (e) {
                    throw new Error('Blog JSON dosyası bozuk veya formatı hatalı.');
                }

                // --- 2. TURLARI ÇEK ---
                // DÜZELTME: Dosya adı "tours.json" değil "tour.json" yapıldı
                const tourUrl = `https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/data/tour.json`;
                debugLog(`🔍 Tur aranıyor: ${tourUrl}`, 'info');

                const toursResponse = await fetch(tourUrl, { headers });

                if (!toursResponse.ok) {
                    throw new Error(`Tur dosyası (tour.json) bulunamadı! Hata Kodu: ${toursResponse.status}`);
                }

                const toursData = await toursResponse.json();
                try {
                    const toursContent = safeDecode(toursData.content);
                    const rawTours = JSON.parse(toursContent);
                    
                    // Format dönüşümü
                    tours = rawTours.map(tour => (typeof convertFromNewFormat === 'function') ? convertFromNewFormat(tour) : tour);
                    debugLog(`✅ Turlar yüklendi: ${tours.length} adet`, 'success');
                } catch (e) {
                    throw new Error('Tur JSON dosyası bozuk.');
                }
                
                // Listeleri oluştur
                renderBlogList();
                renderTourList();
                updateStats();
                
            } catch (error) {
                console.error(error);
                debugLog(`❌ ${error.message}`, 'error');
            }
        }

        function setupImageUpload(type) {
            const area = document.getElementById(`${type}-upload-area`);
            const input = document.getElementById(`${type}-image`);
            
            area.addEventListener('click', () => input.click());
            area.addEventListener('dragover', e => { e.preventDefault(); area.style.borderColor = '#38bdf8'; });
            area.addEventListener('dragleave', () => area.style.borderColor = '#cbd5e1');
            area.addEventListener('drop', e => {
                e.preventDefault();
                area.style.borderColor = '#cbd5e1';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) handleImageUpload(file, type);
            });
            
            input.addEventListener('change', e => {
                const file = e.target.files[0];
                if (file) handleImageUpload(file, type);
            });
        }
        
        function handleImageUpload(file, type) {
            const extension = file.name.split('.').pop().toLowerCase();
            const validExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
            
            if (!validExtensions.includes(extension)) {
                showAlert(`${type}-alert`, '❌ Only JPG, PNG, GIF, WEBP!', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = e => {
                const timestamp = Date.now();
                if (type === 'blog') {
                    currentBlogImage = e.target.result;
                    currentBlogImageName = `blog-${timestamp}.${extension}`;
                    document.getElementById('blog-preview-img').src = currentBlogImage;
                    document.getElementById('blog-preview').classList.add('show');
                } else {
                    currentTourImage = e.target.result;
                    currentTourImageName = `tour-${timestamp}.${extension}`;
                    document.getElementById('tour-preview-img').src = currentTourImage;
                    document.getElementById('tour-preview').classList.add('show');
                }
                showAlert(`${type}-alert`, `✅ ${file.name} loaded!`, 'success');
            };
            reader.readAsDataURL(file);
        }

        // Translation
        async function translateText(text, lang) {
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=tr|${lang}`;
                const res = await fetch(url);
                const data = await res.json();
                return data.responseData?.translatedText || text;
            } catch {
                return text;
            }
        }
        
        // GitHub functions
        async function uploadToGitHub(path, content, message) {
            try {
                let sha = null;
                try {
                    const checkResponse = await fetch(
                        `https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/${path}`,
                        {
                            headers: {
                                'Authorization': `token ${githubConfig.token}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );
                    if (checkResponse.ok) {
                        const fileData = await checkResponse.json();
                        sha = fileData.sha;
                    }
                } catch (e) {}
                
                const response = await fetch(
                    `https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/${path}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${githubConfig.token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            content: btoa(unescape(encodeURIComponent(content))),
                            sha: sha
                        })
                    }
                );
                
                return response.ok;
            } catch (error) {
                console.error('GitHub upload error:', error);
                return false;
            }
        }
        
        async function uploadImageToGitHub(base64Data, filename, message) {
            try {
                const base64Content = base64Data.split(',')[1];
                
                const response = await fetch(
                    `https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/assets/${filename}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${githubConfig.token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            content: base64Content
                        })
                    }
                );
                
                return response.ok;
            } catch (error) {
                console.error('Image upload error:', error);
                return false;
            }
        }

                        <h4>${b.title}</h4>
                        <p>${b.category} • ${b.date} • 🌍 7 languages</p>
                    </div>
                    <div class="item-actions">
                        <button class="btn btn-small btn-primary" onclick="editBlog(${i})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-small btn-danger" onclick="deleteBlog(${i})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('') : '<p style="text-align:center;color:#888;padding:20px">No blogs yet</p>';
        }
        
        function renderTourList() {
            const list = document.getElementById('tour-list');
            list.innerHTML = tours.length ? tours.map((t, i) => `
                <div class="item-card">
                    <img src="https://raw.githubusercontent.com/${githubConfig.username}/${githubConfig.repo}/main/${t.image}" alt="${t.title}" onerror="this.src='https://placehold.co/80x60/38bdf8/FFF?text=Tour'">
                    <div class="item-info">
                        <h4>${t.title}</h4>
                        <p>${t.category} • ${t.price} • 🌍 7 languages</p>
                    </div>
                    <div class="item-actions">
                        <button class="btn btn-small btn-primary" onclick="editTour(${i})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-small btn-danger" onclick="deleteTour(${i})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('') : '<p style="text-align:center;color:#888;padding:20px">No tours yet</p>';
        }
        
        function updateStats() {
            document.getElementById('blog-count').textContent = blogPosts.length;
            document.getElementById('tour-count').textContent = tours.length;
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }
        
        function showAlert(id, msg, type) {
            const alert = document.getElementById(id);
            alert.className = `alert alert-${type} show`;
            alert.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-triangle' : 'info-circle'}"></i> ${msg}`;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
        
        window.switchTab = switchTab;
        window.resetBlogForm = resetBlogForm;
        window.resetTourForm = resetTourForm;
        window.editBlog = editBlog;
        window.deleteBlog = deleteBlog;
        window.editTour = editTour;
        window.deleteTour = deleteTour;
        window.logout = logout;
    </script>
</body>
</html>
